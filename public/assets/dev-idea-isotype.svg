<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Dev.Idea" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Dev.Idea</title>
  <!-- Rectángulo áureo 13×8 · 1 unidad = 6.6 px · centrado en 100×100 -->
  <g transform="translate(7.1 23.6) scale(6.6)" stroke="currentColor" stroke-width="0.8">
    <!-- Caos: arco exterior disuelto en puntos -->
